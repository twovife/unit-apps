name: deploy-production

# Production (muv.ubmidigital.com, /srv/apps/production/muv) hanya lewat tag
# rilis dari branch main, contoh:
#   git checkout main && git tag v1.0.0 && git push origin v1.0.0
# Tag yang commit-nya bukan bagian dari main ditolak. Pasangan staging:
# deploy-staging.yml (push ke develop). Migrasi TIDAK pernah dijalankan dari sini -
# migrasi hanya dari app_laravel (database dipakai bersama).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

# Dua tag didorong berdekatan: deploy berjalan berurutan, tidak saling potong
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/twovife/mantriapps

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Rilis production hanya dari main.
      - name: Pastikan tag ada di main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} bukan dari branch main - deploy production ditolak." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_PRODUCTION }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Key deploy production terpisah dari staging, dikunci (command= di
      # authorized_keys VPS) ke /srv/apps/production/muv/deploy.sh.
      # Isi script: .github/deploy/mantriapps-production-deploy.sh
      - name: Deploy di VPS
        run: ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "${{ github.ref_name }}"
