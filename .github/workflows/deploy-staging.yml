name: deploy-staging

# Staging (mv2.ubmidigital.com, /srv/apps/staging/mantriappsv2): setiap push ke
# branch `develop` di-build lalu dideploy otomatis, tag image staging-<sha>.
# Production (tag v* dari main) menyusul. Polanya sama dengan app_laravel.
# Migrasi TIDAK pernah dijalankan dari sini - unit-apps dan app_laravel berbagi
# satu database; migrasi hanya dari app_laravel.
on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

# Dua push berdekatan: deploy berjalan berurutan, tidak saling potong
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/twovife/mantriapps
  TAG: staging-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:staging
          # Menautkan package ghcr ke repo ini (izin tulis GITHUB_TOKEN).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Key deploy dikunci (command= di authorized_keys VPS) ke deploy.sh;
      # yang dikirim hanya tag, script di VPS yang menentukan langkahnya.
      # Isi script: .github/deploy/mantriapps-staging-deploy.sh
      - name: Deploy di VPS
        run: ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "${{ env.TAG }}"
