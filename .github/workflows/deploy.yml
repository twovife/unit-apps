name: deploy

# Staging   : push tag v*      → build image lalu deploy ke mv2.ubmidigital.com
#             git tag v1.4.0 && git push origin v1.4.0
# Production: push tag prod-v* → pakai image yang SUDAH dites di staging, tanpa build ulang
#             git tag prod-v1.4.0 && git push origin prod-v1.4.0   (deploy image v1.4.0)
# Production: muv.ubmidigital.com. Pola sama dengan app_laravel.
# Migrasi TIDAK dijalankan di sini; migrasi hanya dari app_laravel (database dipakai bersama).
on:
  push:
    tags:
      - 'v*'
      - 'prod-v*'

permissions:
  contents: read
  packages: write

# Deploy ke tujuan yang sama berjalan berurutan, tidak saling potong
concurrency:
  group: deploy-${{ startsWith(github.ref_name, 'prod-') && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/twovife/mantriapps

jobs:
  # Production memakai image yang sudah ada di ghcr, jadi build hanya untuk tag baru
  build:
    if: ${{ !startsWith(github.ref_name, 'prod-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Jalan setelah build (tag v*) atau langsung untuk tag prod-v* (build dilewati)
    if: ${{ always() && (needs.build.result == 'success' || startsWith(github.ref_name, 'prod-')) }}
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref_name, 'prod-') && 'production' || 'staging' }}
    env:
      TUJUAN: ${{ startsWith(github.ref_name, 'prod-') && 'production' || 'staging' }}
      REF: ${{ github.ref_name }}
    steps:
      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Key deploy dikunci (command= di authorized_keys VPS) ke mantriapps-deploy.sh;
      # yang dikirim hanya "<tujuan> <tag>", script di VPS yang menentukan langkahnya.
      # Isi script: .github/deploy/mantriapps-deploy.sh
      - name: Deploy di VPS
        run: ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "$TUJUAN ${REF#prod-}"
