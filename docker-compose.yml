version: '3.8'

services:
  unit-app-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: unit-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - app_laravel_laravel-network

  vite:
    image: node:20-alpine
    container_name: unit-vite
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5174:5174"
    command: npm run dev
    networks:
      - app_laravel_laravel-network

  web:
    image: nginx:alpine
    container_name: unit-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_laravel_laravel-network
    depends_on:
      - unit-app-service

networks:
  app_laravel_laravel-network:
    external: true
